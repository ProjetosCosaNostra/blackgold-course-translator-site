name: BGCT site static audit (no deploy)
on:
  push:
    branches:
      - work/bgct-restart-zero-budget-i18n-20261102
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'tools/check-site.mjs'
      - '.github/workflows/site-static-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check staged international site
        run: node tools/check-site.mjs
