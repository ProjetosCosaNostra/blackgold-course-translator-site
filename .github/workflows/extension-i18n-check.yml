name: BGCT extension i18n contract (no deploy)
on:
  push:
    branches:
      - work/bgct-restart-zero-budget-i18n-20261102
    paths:
      - 'extension-staging/**'
      - 'tools/check-extension-i18n.mjs'
      - '.github/workflows/extension-i18n-check.yml'
  pull_request:
    paths:
      - 'extension-staging/**'
      - 'tools/check-extension-i18n.mjs'
      - '.github/workflows/extension-i18n-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate localized extension resources
        run: |
          node tools/check-extension-i18n.mjs
          node tools/check-translator-api.mjs
