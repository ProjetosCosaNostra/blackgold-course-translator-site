name: BGCT candidate MV3 Chromium smoke (synthetic, no deploy)
on:
  push:
    branches:
      - work/bgct-restart-zero-budget-i18n-20261102
    paths:
      - 'extension-candidate/**'
      - 'extension-staging/**'
      - 'tools/check-candidate-chromium.mjs'
      - '.github/workflows/candidate-chromium-smoke.yml'
  pull_request:
    paths:
      - 'extension-candidate/**'
      - 'extension-staging/**'
      - 'tools/check-candidate-chromium.mjs'
      - '.github/workflows/candidate-chromium-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome for Testing (allows unpacked MV3 extensions)
        id: chrome_for_testing
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Open MV3 candidate in disposable Chrome for Testing on synthetic local HTTPS lesson
        env:
          CHROME_PATH: ${{ steps.chrome_for_testing.outputs.chrome-path }}
        run: |
          "$CHROME_PATH" --version
          openssl version
          node tools/check-candidate-chromium.mjs
